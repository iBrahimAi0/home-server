services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      BOTS_DIR: /app/bots
      BOTS_CONFIG_PATH: /app/config/bots.json
      AUTH_TOKEN: ${AUTH_TOKEN:?Run bash scripts/setup-host.sh first}
    volumes:
      - ./bots:/app/bots
      - ./backend/config:/app/config

  dashboard:
    build:
      context: .
      args:
        FORGE_BACKEND_URL: http://backend:3001
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORGE_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      FORGE_BACKEND_URL: http://backend:3001
      FORGE_USERNAME: ${FORGE_USERNAME:-admin}
      AUTH_TOKEN: ${AUTH_TOKEN:?Run bash scripts/setup-host.sh first}
    depends_on:
      - backend
